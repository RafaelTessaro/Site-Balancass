; Painel Balanças.com — limites do PHP para esta pasta (PHP-FPM/CGI, como na HostGator).
; Fotos de até 8 MB (o painel reduz no próprio celular antes de enviar; isto é a folga).
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
display_errors = Off
log_errors = On
